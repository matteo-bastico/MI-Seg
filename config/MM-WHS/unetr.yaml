# Experiment setup
default_root_dir: "./experiments"
study_name: MM-WHS
trial_name: unetr

# Model
model: unetr
in_channels: 1
out_channels: 8
feature_size: 16
hidden_size: 768
mlp_dim: 3072
num_heads: 12
proj_type: conv
conv_block: true
res_block: true
dropout_rate: 0.0
spatial_dims: 3
qkv_bias: false
save_attn: false
vit_norm: layer
enc_norm:
  - instance_cond
  - num_styles: 2
    affine: true
dec_norm:
  - instance
  - affine: true
freeze_enc: false

# Training
epochs: 2
iters_to_accumulate: 1
check_val_every_n_epoch: 2
amp: false
find_unused_parameters: true

# Loss
criterion: dice_focal
smooth_nr: 0.0
smooth_dr: 0.000001
squared_pred: true

# Metrics
include_background: false
classes:
  0: BG
  1: LV
  2: RV
  3: LA
  4: RA
  5: MYO
  6: AA
  7: PA
modalities:
  0: CT
  1: MRI

# Optimizer
optim_name: adamw
lr: 0.0001
reg_weight: 0.00001

# Scheduler
scheduler: warmup_cosine
warmup_epochs: 1
cycles: 0.5

# Model Inferer
infer_overlap: 0.5
sw_batch_size: 1
inferer_device: cpu

# Datasets
data_dirs:
  - ../../Datasets/MM-WHS
  - ../../Datasets/MM-WHS
json_lists:
  - CT_fold1.json
  - MR.json
batch_size: 1
roi_x: 96
roi_y: 96
roi_z: 96
space_x: 1.0
space_y: 1.0
space_z: 1.0
patches_training_sample: 1
randFlipd_prob: 0.2
randRotate90d_prob: 0.2
randScaleIntensityd_prob: 0.1
randShiftIntensityd_prob: 0.1
use_normal_dataset: false  # No CacheDataset from monai
cache_num: 24
loader_workers: 8  # To load in cache
num_workers: 8  # Per dataloader
