# Experiment setup
default_root_dir: "./experiments"
study_name: MM-WHS
trial_name: unet

# Model
model: unet
# pretrained: experiments/MM-WHS/unet/model/best.pt
spatial_dims: 3
in_channels: 1
out_channels: 8
num_layers: 4
strides: [2, 2, 2]
channels: [16, 32, 64, 128]
kernel_size: 3
up_kernel_size: 3
dropout_rate: 0.0
enc_norm:
  - instance_cond  # Name
  - num_styles: 2  # Settings
    affine: true
dec_norm:
  - instance
  - affine: true
num_res_units: 2
activation: prelu
bias: true
adn_ordering: NDA
freeze_enc: false

# Training
epochs: 2
iters_to_accumulate: 1
check_val_every_n_epoch: 2
amp: false
find_unused_parameters: true

# Loss
criterion: dice_ce
smooth_nr: 0.0
smooth_dr: 0.000001
squared_pred: true
partial: bg-sum
regularize_unlabeled: true
lambda_reg: 1.0
labeled_classes:
  0: [0, 1, 2, 3, 4, 6, 7]
  1: [0, 2, 5, 6, 7]

# Metrics
include_background: false
classes:
  0: BG
  1: LV
  2: RV
  3: LA
  4: RA
  5: MYO
  6: AA
  7: PA
modalities:
  0: CT
  1: MRI

# Optimizer
optim_name: adamw
lr: 0.0001
reg_weight: 0.00001

# Scheduler
scheduler: warmup_cosine
warmup_epochs: 1
cycles: 0.5

# Model Inferer
infer_overlap: 0.5
sw_batch_size: 1
inferer_device: cpu

# Datasets
data_dirs:
  - ../../Datasets/MM-WHS
  - ../../Datasets/MM-WHS
json_lists:
  - CT_fold1.json
  - MR.json
batch_size: 1
roi_x: 96
roi_y: 96
roi_z: 96
space_x: 1.0
space_y: 1.0
space_z: 1.0
patches_training_sample: 1
randFlipd_prob: 0.2
randRotate90d_prob: 0.2
randScaleIntensityd_prob: 0.1
randShiftIntensityd_prob: 0.1
use_normal_dataset: false  # No CacheDataset from monai
cache_num: 24
loader_workers: 8  # To load in cache
num_workers: 8  # Per dataloader
zoom_prob: 0.0
min_zoom: [1, 1.5]
max_zoom: [0.5, 1]
